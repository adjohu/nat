[package]
name = "nat-runner"
version = "0.1.0"
edition = "2021"
description = "A small runner for natural-language source projects"
authors = ["Adam Hutchinson"]
license = "Apache-2.0"
repository = "https://github.com/adjohu/nat"

[[bin]]
name = "nat"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
