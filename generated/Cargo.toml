[package]
name = "nat-runner"
version = "0.1.0"
edition = "2021"
description = "A local natural-language source compiler"
license = "Apache-2.0"

[[bin]]
name = "nat"
path = "src/main.rs"

[dependencies]
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
